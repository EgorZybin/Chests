server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location = /join {
        try_files /join.html =404;
    }

    location = /terms {
        try_files /terms.html =404;
    }

    location = /privacy {
        try_files /privacy.html =404;
    }

    location = / {
        try_files /index.html =404;
    }
}
