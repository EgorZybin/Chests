services:
  bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: Europe/Moscow
      STATE_PATH: /app/data/state.json
    volumes:
      - ./data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
