services:
  bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: Europe/Moscow
      STATE_PATH: /app/data/state.json
    volumes:
      - ./data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    volumes:
      - ./legal/html:/usr/share/nginx/html:ro
      - ./legal/conf.d:/etc/nginx/conf.d:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
